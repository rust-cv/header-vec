[package]
name = "header-vec"
version = "0.1.3"
authors = ["Geordon Worley <vadixidav@gmail.com>"]
edition = "2021"
description = "Vector with user-specified header, length, capacity, and array elements all stored on the heap together"
documentation = "https://docs.rs/header-vec/"
repository = "https://github.com/rust-cv/header-vec"
keywords = ["header", "heap", "vec", "vector", "graph"]
categories = ["no-std"]
license = "MIT"
readme = "README.md"

[features]
default = ["std", "atomic_append"]
std = []
atomic_append = []

[dev-dependencies]
xmacro = "0.4.0"

# include debug info for flamgraph and other profiling tools
[profile.bench]
debug = true

[dependencies]
mutants = "0.0.3"
